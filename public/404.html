<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex" />
        <title>Redirecting…</title>
        <script>
            const target = `${location.pathname}${location.search}${location.hash}`;
            sessionStorage.setItem('github-pages-redirect', target);
            location.replace('/');
        </script>
    </head>
    <body></body>
</html>
