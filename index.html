<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="/favicon.ico" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="hsl(0, 0%, 95%)" />
        <meta
            name="description"
            content="Portfolio of Bangyen Pham - Backend Developer and AI/ML Engineer specializing in cloud architecture, HPC systems, and machine learning research. MS CS graduate from Northwestern University."
        />
        <meta
            name="keywords"
            content="Bangyen Pham, Backend Developer, AI Researcher, ML Engineer, Northwestern University, Portfolio, Lights Out Solver, Slant Puzzle"
        />
        <meta name="author" content="Bangyen Pham" />
        <meta name="robots" content="index, follow" />
        <link rel="canonical" href="https://bangyen.github.io/" />
        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/apple-touch-icon.png"
        />

        <link
            rel="preload"
            href="/fonts/inter-latin-400-normal.woff2"
            as="font"
            type="font/woff2"
            crossorigin
            fetchpriority="high"
        />
        <style>
            @font-face {
                font-family: 'Inter';
                font-style: normal;
                font-weight: 400;
                font-display: swap;
                src: url('/fonts/inter-latin-400-normal.woff2') format('woff2');
            }

            @font-face {
                font-family: 'Inter';
                font-style: normal;
                font-weight: 500;
                font-display: swap;
                src: url('/fonts/inter-latin-500-normal.woff2') format('woff2');
            }

            @font-face {
                font-family: 'Inter';
                font-style: normal;
                font-weight: 600;
                font-display: swap;
                src: url('/fonts/inter-latin-600-normal.woff2') format('woff2');
            }

            @font-face {
                font-family: 'Inter';
                font-style: normal;
                font-weight: 700;
                font-display: swap;
                src: url('/fonts/inter-latin-700-normal.woff2') format('woff2');
            }
        </style>
        <title>Bangyen Pham - Backend Developer & AI/ML Engineer</title>

        <!-- Open Graph / Facebook -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://bangyen.github.io/" />
        <meta
            property="og:title"
            content="Bangyen Pham - Backend Developer & AI/ML Engineer"
        />
        <meta
            property="og:description"
            content="Portfolio of Bangyen Pham, specializing in cloud architecture, HPC systems, and machine learning research."
        />
        <meta
            property="og:image"
            content="https://bangyen.github.io/og-image.png"
        />

        <!-- Twitter -->
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:url" content="https://bangyen.github.io/" />
        <meta
            property="twitter:title"
            content="Bangyen Pham - Backend Developer & AI/ML Engineer"
        />
        <meta
            property="twitter:description"
            content="Portfolio of Bangyen Pham, specializing in cloud architecture, HPC systems, and machine learning research."
        />
        <meta
            property="twitter:image"
            content="https://bangyen.github.io/og-image.png"
        />
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Person",
                "name": "Bangyen Pham",
                "url": "https://bangyen.github.io/",
                "jobTitle": "Backend Developer & AI/ML Engineer",
                "alumniOf": {
                    "@type": "CollegeOrUniversity",
                    "name": "Northwestern University"
                },
                "sameAs": ["https://github.com/bangyen"]
            }
        </script>
        <script>
            const redirect = sessionStorage.getItem('github-pages-redirect');
            if (redirect) {
                sessionStorage.removeItem('github-pages-redirect');
                history.replaceState(null, '', redirect);
            }
        </script>
    </head>

    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <script type="module" src="/src/index.tsx"></script>
    </body>
</html>
